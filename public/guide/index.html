    /* Local fonts — Raleway for text, Brandon Grotesque for numerals */

    /* Reader — vertical flow of pages / spreads.
       .reader-mobile is shown < 900px, .reader-desktop is shown ≥ 900px.
       Mobile: no horizontal padding so pages take the full screen width. */
    .reader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 28px 0 48px;
    }

    .reader-desktop { display: none; }

    /* Single A5 page — dictates the aspect-ratio, clips its image. */
    .page {
      position: relative;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 148 / 210;
      background: transparent;
      overflow: hidden;
    }

    /* Landscape frame — a spread rendered as a single wide SVG (2:√2 ratio),
       used on the desktop version for pre-combined double-pages. */
    .page.landscape {
      max-width: 1040px;
      aspect-ratio: 1190.25 / 842.25;
    }

    /* Image slightly larger than .page + negative margin — hides any subpixel
       gap at the edges that would otherwise show a thin line. */
    .page img {
      display: block;
      width: 101%;
      height: 101%;
      margin: -0.5%;
      object-fit: cover;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* Spread wrapper — stacked on mobile, side by side on desktop */
    .spread {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
      align-items: center;
    }

    .spread .page { max-width: 720px; }

    /* Header — subtle brand line above the reader */
    .reader-header {
      text-align: center;
      padding: 40px 16px 12px;
      color: rgba(242, 237, 230, 0.65);
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    .reader-header a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(242, 237, 230, 0.2);
      padding-bottom: 2px;
    }

    .reader-footer {
      text-align: center;
      padding: 20px 16px 40px;
      color: rgba(242, 237, 230, 0.55);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }
    .reader-footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .reader-footer a:hover {
      color: rgba(242, 237, 230, 0.85);
    }

    /* ─────────────────────────────────────────
       TABLET & DESKTOP (≥ 900px) — double spreads
       Cover + back cover: single centered pages.
       Pages 2–19: shown as double spreads (two A5 pages side by side).
       ───────────────────────────────────────── */
    @media (min-width: 900px) {
      /* Swap mobile flow for desktop flow */
      .reader-mobile { display: none; }
      .reader-desktop { display: flex; }

      .reader { gap: 44px; padding: 44px 24px 64px; }

      /* Cover + back cover — same width as one page of a spread */
      .page.standalone { max-width: 520px; }

      /* Landscape spread — full width of a two-page book */
      .page.landscape { max-width: 1040px; }

      .spread {
        flex-direction: row;
        gap: 0;
        max-width: 1040px;
        align-items: flex-start; /* top-align so no vertical offset between pages */
      }

      /* Each page in a spread takes exactly half the container — identical width,
         identical aspect-ratio → identical computed height, perfect alignment */
      .spread .page {
        max-width: 520px;
        flex: 0 0 50%;
      }
    }

    /* Larger desktop — cap the spread width so pages don't get oversized */
    @media (min-width: 1400px) {
      .spread { max-width: 1120px; }
      .spread .page { max-width: 560px; }
      .page.standalone { max-width: 560px; }
      .page.landscape { max-width: 1120px; }
    }

    @media print {
      body { background: #fff; }
      .reader { gap: 0; padding: 0; }
      .page, .spread { box-shadow: none; page-break-after: always; }
      .reader-header, .reader-footer { display: none; }
    }

    a:focus-visible {
      outline: 2px solid #1c1c1c;
      outline-offset: 3px;
    }
  </style>

  <script>
    /* Keyboard navigation — scroll to next/previous slide with arrow keys,
       PageUp/PageDown or Space. Scroll and touch still work as usual. */
    (function () {
      function activeReader() {
        return window.matchMedia("(min-width: 900px)").matches
          ? document.querySelector(".reader-desktop")
          : document.querySelector(".reader-mobile");
      }

      function slides() {
        var r = activeReader();
        return r ? Array.from(r.children) : [];
      }

      function currentIndex(list) {
        // Slide currently occupying the upper third of the viewport
        var threshold = window.scrollY + window.innerHeight * 0.33;
        for (var i = list.length - 1; i >= 0; i--) {
          var top = list[i].getBoundingClientRect().top + window.scrollY;
          if (top <= threshold) return i;
        }
        return 0;
      }

      function goTo(el) {
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      document.addEventListener("keydown", function (e) {
        // Don't hijack keys when the user is typing in a form field
        var t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;

        var forward = e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown" || (e.key === " " && !e.shiftKey);
        var backward = e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp" || (e.key === " " && e.shiftKey);
        if (!forward && !backward) return;

        var list = slides();
        if (!list.length) return;

        e.preventDefault();
        var i = currentIndex(list);
        var next = forward ? Math.min(i + 1, list.length - 1) : Math.max(i - 1, 0);
        goTo(list[next]);
      });
    })();
  </script>
