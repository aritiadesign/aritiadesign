<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Signature mail — Aritia Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Open+Sans:wght@400;500;600&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    @media only screen and (max-width: 500px) {
      .sig-table { width: 100% !important; max-width: 100% !important; }
      .sig-cell-wrap { padding: 24px 20px 20px 20px !important; }
      .sig-row { display: block !important; width: 100% !important; }
      .sig-logo-cell {
        display: block !important;
        width: 100% !important;
        padding: 0 0 20px 0 !important;
        border-right: 0 !important;
        border-bottom: 1px solid rgba(255,255,255,0.14) !important;
        text-align: center !important;
      }
      .sig-logo-cell img { width: 140px !important; height: auto !important; margin: 0 auto !important; }
      .sig-text-cell { display: block !important; width: 100% !important; padding: 20px 0 0 0 !important; }
      .sig-footer-cell { padding: 10px 20px 12px 20px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:32px;background:#f7f5f1;font-family:'Raleway',Arial,Helvetica,sans-serif;">

  <!--
    SIGNATURE MAIL — ARITIA DESIGN
    ------------------------------------------------------------------
    DA calquée sur le footer du site aritiadesign.com (version dark).
    Fond noir #1a1a1a, logo blanc, tagline Playfair italique, Instagram.

    Copie/colle TOUT le bloc <table>…</table> ci-dessous dans :
      • Gmail  → Paramètres → Signature → coller dans l'éditeur
      • Apple Mail / Outlook → Préférences > Signatures > coller en mode HTML
    Le rendu est testé sur Gmail, Apple Mail, Outlook.
  -->

  <table class="sig-table" cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;background:#1a1a1a;max-width:620px;font-family:'Raleway',Arial,Helvetica,sans-serif;color:#ffffff;width:620px;">

    <!-- BLOC PRINCIPAL : logo + identité -->
    <tr>
      <td class="sig-cell-wrap" style="padding:36px 36px 28px 36px;">
        <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;width:100%;">
          <tr class="sig-row">

            <!-- Colonne logo (monogram + ARITIA DESIGN stacked, blanc) -->
            <td class="sig-logo-cell" valign="middle" align="center" style="padding:0 32px 0 0;border-right:1px solid rgba(255,255,255,0.14);width:200px;">
              <img src="https://www.aritiadesign.com/images/signature-logo-white.png" alt="Aritia Design" width="180" style="display:block;margin:0 auto;width:180px;height:auto;" />
            </td>

            <!-- Colonne texte -->
            <td class="sig-text-cell" valign="middle" style="padding:0 0 0 36px;">
              <!-- Coordonnées -->
              <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:'Raleway',Arial,Helvetica,sans-serif;font-size:12px;line-height:1.8;letter-spacing:0.09em;color:rgba(255,255,255,0.85);">
                <tr>
                  <td><a href="tel:+33698364379" style="font-family:'Brandon Grotesque','Open Sans',Arial,Helvetica,sans-serif;font-weight:500;letter-spacing:0.05em;color:rgba(255,255,255,0.85);text-decoration:none;">+33&nbsp;6&nbsp;98&nbsp;36&nbsp;43&nbsp;79</a></td>
                </tr>
                <tr>
                  <td><a href="mailto:contact@aritiadesign.com" style="color:rgba(255,255,255,0.85);text-decoration:none;">contact@aritiadesign.com</a></td>
                </tr>
                <tr>
                  <td><a href="https://www.aritiadesign.com" style="color:rgba(255,255,255,0.85);text-decoration:none;">www.aritiadesign.com</a></td>
                </tr>
                <tr>
                  <td style="color:rgba(255,255,255,0.65);">Toulouse &middot; Haute-Garonne</td>
                </tr>
              </table>

              <!-- Social (Instagram + Pinterest, icônes blanches) -->
              <div style="margin-top:20px;">
                <span style="display:block;font-family:'Raleway',Arial,Helvetica,sans-serif;font-size:8.5px;letter-spacing:0.32em;text-transform:uppercase;color:rgba(255,255,255,0.65);margin-bottom:6px;">Suivez-nous</span>
                <a href="https://www.instagram.com/aritia_design/" target="_blank" rel="noopener noreferrer" style="color:#ffffff;text-decoration:none;display:inline-block;margin-right:14px;vertical-align:middle;">
                  <img src="https://www.aritiadesign.com/images/signature-instagram-white.png" alt="Instagram" width="22" height="22" style="display:inline-block;width:22px;height:22px;border:0;vertical-align:middle;" />
                </a>
                <a href="https://www.pinterest.com/aritiadesign/" target="_blank" rel="noopener noreferrer" style="color:#ffffff;text-decoration:none;display:inline-block;vertical-align:middle;">
                  <img src="https://www.aritiadesign.com/images/signature-pinterest-white.png" alt="Pinterest" width="22" height="22" style="display:inline-block;width:22px;height:22px;border:0;vertical-align:middle;" />
                </a>
              </div>

            </td>
          </tr>
        </table>
      </td>
    </tr>

</table>

</body>
</html>
